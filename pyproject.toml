[build-system]
requires = [
    "setuptools>=84.0.0",
    "setuptools-scm>=10.2.1",
]
build-backend = "setuptools.build_meta"

[project]
name = "keba_keenergy_api"
description = "A Python wrapper for the KEBA KeEnergy API used by the Web HMI."
readme = "README.md"
authors = [
    { name = "Michael Hacker", email = "mh@superbox.one" },
]
maintainers = [
    { name = "Michael Hacker", email = "mh@superbox.one" },
]
license-files = [
    "LICENSE"
]
keywords = [
    "api",
    "component",
    "custom component",
    "custom integration",
    "keba",
    "keenergy",
    "hacs-component",
    "hacs-integration",
    "hacs-repository",
    "hacs",
    "hass",
    "home assistant",
    "home-assistant",
    "homeassistant",
    "integration",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">= 3.10"
dependencies = [
    "aiohttp==3.*"
]
dynamic = ["version"]

[project.urls]
"Homepage" = "https://superbox.one"
"Documentation" = "https://api.superbox.one"
"Issues" = "https://github.com/superbox-dev/keba_keenergy_api/issues"
"Source" = "https://github.com/superbox-dev/keba_keenergy_api"

[dependency-groups]
dev = [
    { include-group = "build" },
    { include-group = "docs" },
    { include-group = "lint" },
    { include-group = "test" },
]
build = [
    "setuptools>=84.0.0",
    "build>=1.5.0",
]
docs = [
    "mkdocs~=1.6.1",
    "mkdocs-include-markdown-plugin>=7.2.0",
    "mkdocs-material==9.7.7",
    "mkdocstrings[python]>=1.0.0",
]
lint = [
    "prek>=0.4.13",
    "ruff>=0.16.2",
    "rumdl>=0.2.54",
    "ty>=0.0.70",
    "types-PyYAML>=6.0.12.20260724",
    "yamllint>=1.38.0",
]
test = [
    "aioresponses-ng>=0.8.2",
    "coverage>=7.15.2",
    "genbadge[coverage]>=1.1.3",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist[psutil]>=3.8.0",
]

[tool.setuptools]
packages = ["keba_keenergy_api"]

[tool.setuptools_scm]
write_to = "keba_keenergy_api/version.py"
