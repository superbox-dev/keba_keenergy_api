line-length = 120
target-version = "py314"

[lint]
select = ["ALL"]
# Rules that the numpy convention would turn off, but that the code already follows
extend-select = ["D107", "D212", "D402", "D413", "D417"]
ignore = [
    "COM812",  # missing-trailing-comma, conflicts with the formatter
]

[lint.per-file-ignores]
"tests/*" = [
    "S101",    # assert, pytest checks results with assert
]

[lint.flake8-tidy-imports.banned-api]
"typing.cast".msg = "Narrow types with runtime checks (e.g. `isinstance`) or generics"

[lint.flake8-type-checking]
# Field types of the public models must exist at runtime, e.g. for typing.get_type_hints().
runtime-evaluated-decorators = ["dataclasses.dataclass"]
runtime-evaluated-base-classes = ["typing.NamedTuple", "typing.TypedDict"]

[lint.isort]
force-single-line = true

[lint.pydocstyle]
convention = "numpy"

[lint.pylint]
max-args = 6
