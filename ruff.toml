line-length = 120
target-version = "py311"

[lint]
select = ["ALL"]
# Rules that the numpy convention would turn off, but that the code already follows
extend-select = ["D107", "D212", "D402", "D413", "D415", "D416", "D417"]
ignore = [
    "COM812",  # missing-trailing-comma, conflicts with the formatter
]

[lint.per-file-ignores]
"tests/*" = [
    "D",
    "S101",    # assert
]

[lint.isort]
force-single-line = true

[lint.pydocstyle]
convention = "numpy"

[lint.pylint]
max-args = 6
