name: CI/CD

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      build-python-package:
        description: Build python package
        type: boolean
  pull_request:
  schedule:
    - cron: 30 5 * * *
  push:
    branches:
      - main
      - develop
    tags:
      - v*

jobs:
  configure:
    name: Configure
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.set-environments.outputs.environments }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set environments
        id: set-environments
        run: echo "environments=$(jq -c . < ./.github/environments.json)" >> $GITHUB_OUTPUT

  code-analysis:
    name: Code analysis using Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    needs: configure
    strategy:
      fail-fast: False
      matrix:
        python-version: ${{ fromJson(needs.configure.outputs.environments).python-version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up project
        uses: ./.github/actions/setup-project
        with:
          python-version: ${{ matrix.python-version }}
      - name: Format check python files with ruff
        run: uv run ruff format --check $(git ls-files '*.py')
      - name: Type check python files with ty
        run: uv run ty check $(git ls-files '*.py')
      - name: Lint python files with ruff
        run: uv run ruff check $(git ls-files '*.py')
      - name: Lint YAML files
        run: uv run yamllint $(git ls-files '*.yml' '*.yaml')
      - name: Lint Markdown files
        run: uv run rumdl check $(git ls-files '*.md')

  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up project
        uses: ./.github/actions/setup-project
        with:
          python-version: 3.14
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Build website
        run: ./scripts/docs.sh

  security:
    name: Audit packages using Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    continue-on-error: True
    needs: configure
    strategy:
      fail-fast: False
      matrix:
        python-version: ${{ fromJson(needs.configure.outputs.environments).python-version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up project
        uses: ./.github/actions/setup-project
        with:
          python-version: ${{ matrix.python-version }}
      - name: Audit python packages
        run: uv audit

  tests:
    name: Tests using Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    needs: configure
    strategy:
      fail-fast: False
      matrix:
        python-version: ${{ fromJson(needs.configure.outputs.environments).python-version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up project
        uses: ./.github/actions/setup-project
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: uv run pytest
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error
          overwrite: True

  coverage:
    name: Generate coverage badge
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref_type != 'tag'
    needs:
      - configure
      - tests
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up project
        uses: ./.github/actions/setup-project
        with:
          python-version: ${{ fromJson(needs.configure.outputs.environments).python-version[0] }}
      - name: Download coverage
        uses: actions/download-artifact@v8
        with:
          name: coverage-xml-${{ fromJson(needs.configure.outputs.environments).python-version[0] }}
          path: .
      - name: Create coverage badge
        run: uv run genbadge coverage --input-file coverage.xml
      - name: Verify coverage badge changed
        uses: tj-actions/verify-changed-files@a1c6acee9df209257a246f2cc6ae8cb6581c1edf  # v20.0.4
        id: changed-files
        with:
          files: coverage-badge.svg
      - name: Commit coverage badge
        if: steps.changed-files.outputs.files_changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add coverage-badge.svg
          git commit -m "Updated coverage-badge.svg"
      - name: Push changes
        if: steps.changed-files.outputs.files_changed == 'true'
        uses: ad-m/github-push-action@881a6320fdb16eb5318c5054f31c218aec2b324c  # v1.3.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}

  build-python-package:
    name: Build python package
    runs-on: ubuntu-latest
    if: |
      github.ref_type == 'tag'
      || (
        github.ref_type == 'branch'
        && inputs.build-python-package
      )
      && !endsWith(github.ref_name, '/merge')
    needs:
      - configure
      - code-analysis
      - security
      - tests
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up project
        uses: ./.github/actions/setup-project
        with:
          python-version: ${{ fromJson(needs.configure.outputs.environments).python-version[0] }}
      - name: Build package
        run: uv run python -m build
      - name: Upload package files
        uses: actions/upload-artifact@v7
        with:
          name: python-package
          path: dist
          if-no-files-found: error

  release:
    name: Release on GitHub
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    needs:
      - configure
      - build-python-package
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up project
        uses: ./.github/actions/setup-project
        with:
          python-version: ${{ fromJson(needs.configure.outputs.environments).python-version[0] }}
      - name: Download files
        uses: actions/download-artifact@v8
        with:
          name: python-package
          path: dist
      - name: Check if prerelease
        id: check_prerelease
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          echo "Tag: $TAG_NAME"

          if [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+b[0-9]+$ ]]; then
            echo "🟡 Pre-release detected"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "🟢 Regular release"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create release notes
        env:
          PRERELEASE: ${{ steps.check_prerelease.outputs.prerelease }}
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG_NAME#v}"
          HEADING="$(grep -m 1 -F "## [${VERSION}]" CHANGELOG.md | sed 's/^## //' || true)"

          if [[ -n "$HEADING" ]]; then
            # Same anchor as GitHub: lowercase, without punctuation, spaces as hyphens.
            ANCHOR="$(echo "$HEADING" | tr '[:upper:]' '[:lower:]' | tr -d -c 'a-z0-9 _-' | tr ' ' '-')"
          elif [[ "$PRERELEASE" == "true" ]]; then
            ANCHOR="unreleased"
          else
            echo "::error::No section for ${VERSION} in CHANGELOG.md"
            exit 1
          fi

          URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${TAG_NAME}/CHANGELOG.md#${ANCHOR}"
          echo "See the [changelog](${URL}) for all changes." > release-notes.md
          cat release-notes.md
      - name: Release on GitHub
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          files: |
            dist/*.tar.gz
            dist/*.whl
          prerelease: ${{ steps.check_prerelease.outputs.prerelease }}
      - name: Delete old pre-releases and their tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"

          git ls-remote --tags --refs origin 'v*' | sed 's|.*refs/tags/||' |
            while read -r TAG; do
              if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+b[0-9]+$ || "$TAG" == "$TAG_NAME" ]]; then
                continue
              fi

              if gh release view "$TAG" > /dev/null 2>&1; then
                echo "Deleting pre-release and tag $TAG"
                gh release delete "$TAG" --yes --cleanup-tag
              else
                echo "Deleting tag $TAG"
                gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}"
              fi
            done

  publish-on-pypi:
    name: Publish
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    needs:
      - release
    steps:
      - name: Download files
        uses: actions/download-artifact@v8
        with:
          name: python-package
          path: dist
      - name: Publish on PyPi
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist
